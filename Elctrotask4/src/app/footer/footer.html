<footer class="footer">
  <div class="content">

    <!-- 🏪 اسم المتجر -->
    <div class="col">
      <h2 class="logo">⚡ {{ storeName }}</h2>
      <p>Everything You Need in One Place</p>
    </div>

    <!-- 📍 العنوان -->
    <div class="col">
      <h4>Address</h4>
      <p>📍 {{ storeAddress }}</p>
    </div>

    <!-- ✉️ التواصل -->
    <div class="col">
      <h4>Contact Us</h4>
      <p>✉️ {{ contactEmail }}</p>
      <p>📞 {{ phoneNumber }}</p>
    </div>

  </div>

  <!-- © حقوق النشر -->
  <div class="copyright">
    © {{ year }} {{ storeName }}. {{ copyrightMessage }}
  </div>
</footer>
