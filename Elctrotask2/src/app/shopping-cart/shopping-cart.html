<section class="cart">
  <h2>🛒 Shopping Cart</h2>

  <p class="empty" [hidden]="quantity > 0">Your cart is empty.</p>

  <table [hidden]="quantity === 0">
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ productName }}</td>
        <td>{{ price }} JD</td>
        <td>{{ quantity }}</td>
        <td class="total">{{ getTotalPrice() }} JD</td>
      </tr>
    </tbody>
  </table>
</section>
